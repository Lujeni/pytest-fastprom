[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-fastprom"
version = "0.2.0"
description = "Isolated Prometheus metrics assertions for FastAPI tests"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pytest>=7.0",
    "fastapi",
    "httpx",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
]

[project.entry-points."pytest11"]
fastprom = "pytest_fastprom"

[dependency-groups]
dev = ["ruff", "ty"]

[tool.setuptools]
packages = ["pytest_fastprom"]

[tool.pytest.ini_options]
# Override default regression thresholds:
# metrics_compare_fail = "p50:10%,p99:20%"

[tool.typos.default.extend-words]
# Pn = percentile-N (P50, P99); not a typo of "On".
Pn = "Pn"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
